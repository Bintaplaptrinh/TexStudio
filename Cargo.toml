[package]
name = "texstudio-local"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Local-first LaTeX editor and agent CLI powered by MiKTeX"
rust-version = "1.89"

[[bin]]
name = "texstudio"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:dioxus", "dep:rfd", "dep:base64", "dep:tokio", "dep:image"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
regex = "1"
dioxus = { version = "0.7", default-features = false, features = ["desktop", "macro", "html", "signals", "hooks", "launch", "document"], optional = true }
rfd = { version = "0.15", optional = true }
base64 = { version = "0.22", optional = true }
tokio = { version = "1", features = ["time"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
