name: Verify and package Windows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows checks and executable
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check repository privacy
        run: python scripts/check-privacy.py
      - name: Verify privacy guard
        run: python -m unittest discover -s tests -p privacy_test.py
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Remove builder paths from compiled output
        shell: pwsh
        run: |
          $cargoRoot = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $flags = "--remap-path-prefix=$env:GITHUB_WORKSPACE=/source --remap-path-prefix=$cargoRoot=/cargo"
          "RUSTFLAGS=$flags" >> $env:GITHUB_ENV
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test desktop and CLI
        run: cargo test --locked
      - name: Test CLI-only configuration
        run: cargo test --locked --no-default-features
      - name: Test editor behavior
        run: node --test tests/snippets.test.mjs tests/editor-assistance.test.mjs tests/source-buffer.test.mjs
      - name: Build Windows x86_64 executable
        run: cargo build --locked --release
      - name: Smoke-test the executable
        run: .\target\release\texstudio.exe --version
      - name: Package reviewed release files
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TexStudio-windows-x86_64
          path: |
            dist/TexStudio-*-windows-x86_64.exe
            dist/TexStudio-*-windows-x86_64.zip
            dist/TexStudio-*-windows-x86_64-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
